<!DOCTYPE html>
<html lang="ko">
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/congdongzone.js}"></script>
    <link th:href="@{/css/congdongzone.css}" rel="stylesheet">
    <script th:src="@{/js/layout.js}"></script>
    <link th:href="@{/css/layout.css}" rel="stylesheet">

    <title>공구리스트</title>
</head>
<body>
<header>
    <div th:replace="~{fragments/header :: header}"></div>
</header>
<main>
    <header class="tab-header">
        <span id="showAllProducts" class="tab selected">공구리스트</span>
        <span id="showActiveProducts" class="tab">진행중인 공구</span>
    </header>

    <!-- ✅ 전체 공구 리스트 -->
    <div class="product-list all-products-container">
        <div class="all-products" th:each="product : ${products}" th:data-condition="${product.condition}">
            <a th:href="@{/product/detail/{id}(id=${product.id})}">
                <img th:src="@{${product.mainPicturePath}}" th:alt="${product.name}">
            </a>
            <div class="product-details">
                <span class="related-products__badge">
                    <img th:src="@{/images/group_yes.png}" alt="공구 가능 아이콘">
                </span>
                <div class="product-title" th:text="${product.name}"></div>
                <div class="product-price">
                    <span class="discount"></span>
                    <span class="final-price"></span>
                    <span class="original-price" th:text="${#numbers.formatDecimal(product.price, 1, 0)}"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ 진행 중인 공구 리스트 -->
    <div class="product-list active-products-container" style="display: none;">
        <div class="active-products" th:each="active : ${activeProducts}" th:data-condition="${active.condition}"
             th:data-congs="${active.congs}" th:data-startAt="${active.startAt}" th:data-product-id="${active.productId}">
            <a th:href="@{/product/detail/{id}(id=${active.productId})}">
                <img th:src="@{${active.mainPicturePath}}" th:alt="${active.name}">
            </a>
            <div class="product-details">
                <span class="related-products__badge">
                    <img th:src="@{/images/group_ing.png}" alt="공구중 아이콘">
                </span>
                <div class="product-title" th:text="${active.name}"></div>
                <div class="product-info">
                    <div class="group-status">
                        <span class="participants"></span>
                    </div>
                    <div class="product-time">
                        <span class="start-time"></span> ~ <span class="end-time"></span>
                    </div>
                </div>
                <div class="product-price">
                    <span class="discount"></span>
                    <span class="final-price"></span>
                    <span class="original-price" th:text="${#numbers.formatDecimal(active.price, 1, 0)}"></span>
                </div>
                <button class="join-button">지금 참여하기</button>
            </div>
        </div>
    </div>

        <button class="more-button" id="loadMore">더보기</button>

</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
