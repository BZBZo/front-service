<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:height="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/layout.js}"></script>
  <link th:href="@{/css/layout.css}" rel="stylesheet">
  <script th:src="@{/js/review_write.js}"></script>
  <link th:href="@{/css/review_write.css}" rel="stylesheet">

  <title>리뷰등록</title>
</head>
<body class="ootd-registration-body">
<header>
  <div th:replace="~{fragments/header :: header}"></div>
</header>
<main>
  <form id="ootdForm" method="POST" enctype="multipart/form-data">
    <input type="hidden" id="productId" name="productId" th:value="${productId}">
    <input type="hidden" id="purchaseId" name="purchaseId" th:value="${purchaseId}">
    <h2>리뷰 작성</h2>
    <div class="ootd-row">
      <div class="ootd-col-md-4">

        <div class="review-image-upload">
          <div class="image-preview" id="imagePreviewContainer">
            <img id="previewImage" src="" alt="미리보기" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 10px;" />


<!--            <button id="deleteImageButton" class="delete-button" style="display: none;">&times;</button>-->
            <span id="placeholderText">최대 4장 선택<br>권장 이미지 크기 <br>900 × 1000 픽셀</span>
          </div>
          <input type="file" id="reviewImg" name="reviewImg" accept="image/*" class="review-file-input" multiple onchange="previewImages(event)">
        </div>



      </div>
      <input type="text" id="content" name="content" placeholder="내용입력" class="content-input" required>

    </div>
    <div class="review-button-container">
      <button class="review-button" type="button" onclick="submitForm()">리뷰 등록</button>
    </div>
  </form>
</main>
<footer>
  <div th:replace="~{fragments/footer :: footer}"></div>
</footer>
</body>
</html>
