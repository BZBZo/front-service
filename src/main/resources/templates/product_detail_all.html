<!DOCTYPE html>
<html lang="ko">
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/product_detail_all.js}"></script>
    <link th:href="@{/css/product_detail_all.css}" rel="stylesheet">
    <script th:src="@{/js/layout.js}"></script>
    <link th:href="@{/css/layout.css}" rel="stylesheet">

    <title>상품 목록 페이지</title>
</head>
<body>
<header>
    <div th:replace="~{fragments/header :: header}"></div>
</header>
<main>
    <div class="product-container">

        <div class="product-detail-row">
            <input type="hidden" id="productId" th:value="${product.id}">
            <input type="hidden" id="condition" th:value="${product.condition}">
            <div class="product-col-md-4">
                <img th:src="@{${product.mainPicturePath}}" th:alt="${product.name}" />
            </div>

            <div class="product-col-md-8">
                <!-- 카테고리 -->
                <p class="product-detail">
                    카테고리: <span id="productCategory" th:text="${product.category}"></span>
                </p>
                <!-- 상품명 -->
                <p class="product-detail">
                    상품명: <span th:text="${product.name}"></span>
                </p>
                <!-- 판매가 -->
                <p class="product-detail">
                    판매가: <span th:text="${#numbers.formatDecimal(product.price, 1, 0)}"></span> 원
                </p>
                <div class="button-group">
                    <button id="addToCartBtn" class="action-button">장바구니 담기</button>
                    <button id="purchaseBtn" class="action-button black-button">구매하기</button>
                </div>
                <div class="button-group full-width">
                    <button id="congdongBtn" class="action-button red-button" th:if="${product.isCong}">공동구매</button>
                </div>

                <!-- 리뷰 -->
<!--                <p class="product-review" th:text="'리뷰 : ' + ${reviewCount} + '건'"></p>-->
            </div>
        </div>

        <div class="product-description">
            <h2>상세정보</h2>
            <div class="description-image">
                <div th:utext="${#strings.replace(product.description.substring(1), 'src/main/resources/static', '')}"
                     class="product-description-content"></div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div id="congdongModal" class="modal">
    <div class="modal-content">
        <h2>공동구매 모집</h2>
        <span class="close-button">&times;</span>
        <div id="conditionList"></div> <!-- 조건 목록이 여기서 표시됨 -->
    </div>
</div>
</body>
</html>
