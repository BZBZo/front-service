<!-- 기존 코드 유지, 수정사항 추가된 전체 HTML -->
<!DOCTYPE html>
<html lang="ko">
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/layout.js}"></script>
    <link th:href="@{/css/layout.css}" rel="stylesheet">
    <script th:src="@{/js/home.js}"></script>
    <link th:href="@{/css/home.css}" rel="stylesheet">
    <title>home</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<section class="main-slider">
    <div class="slider-track">
        <div class="slide"><img th:src="@{/images/main_bn_01.jpg}" alt="슬라이드 1"></div>
        <div class="slide"><img th:src="@{/images/main_bn_02.jpg}" alt="슬라이드 2"></div>
        <div class="slide"><img th:src="@{/images/main_bn_03.jpg}" alt="슬라이드 3"></div>
        <div class="slide"><img th:src="@{/images/main_bn_04.jpg}" alt="슬라이드 4"></div>
        <div class="slide"><img th:src="@{/images/main_bn_05.jpg}" alt="슬라이드 5"></div>
    </div>
</section>

<section class="titles-section">
    <div class="title-wrapper">
        <div class="title-large">지금 공구중인 제품이에요</div>
        <div class="title-small">바로 참여해보세요</div>
    </div>
    <div class="more-link">
        <a th:href="@{/product/congdong}">더보기 &nbsp; →</a>
    </div>
</section>

<!-- ✅ 진행 중인 공구 상품 슬라이드 -->
<section class="related-products">
    <div class="related-products__carousel">
        <div class="related-products__track-container">
            <ul class="active-products__track">
                <li class="related-products__slide" th:each="active : ${activeProducts}">
                    <div class="related-products__card"
                         th:data-product-id="${active.productId}"
                         th:data-condition="${active.condition}"
                         th:data-congs="${active.congs}">
                        <div class="related-products__image">
                            <a th:href="@{/product/detail/{id}(id=${active.productId})}">
                                <img th:src="@{${active.mainPicturePath}}" alt="공구 상품 이미지">
                            </a>
                        </div>
                        <span class="related-products__badge">
                            <img th:src="@{/images/group_ing.png}" alt="공구중 아이콘">
                        </span>
                        <p class="related-products__name" th:text="${active.name}">상품명</p>
                        <p class="related-products__price" th:text="${#numbers.formatDecimal(active.price, 1, 0)} + ' 원'">가격</p>
                        <button class="join-button">지금 참여하기</button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</section>

<section class="titles-section">
    <div class="title-wrapper">
        <div class="title-large">공구 가능 제품이에요</div>
        <div class="title-small">가장 먼저 참여해보세요</div>
    </div>
    <div class="more-link">
        <a href="/product/congdong">더보기 &nbsp; →</a>
    </div>
</section>

<section class="related-products">
    <div class="related-products__carousel">
        <div class="related-products__track-container">
            <ul class="cong-products__track">
                <li class="related-products__slide" th:each="product : ${congproducts}">
                    <div class="related-products__card">
                        <div class="related-products__image">
                            <a th:href="@{/product/detail/{id}(id=${product.id})}">
                                <img th:src="@{${product.mainPicturePath}}" alt="상품 이미지">
                            </a>
                        </div>
                        <span class="related-products__badge" th:if="${product.isCong}">
                            <img th:src="@{/images/group_yes.png}" alt="공구 가능 아이콘">
                        </span>
                        <p class="related-products__name" th:text="${product.name}">상품명</p>
                        <p class="related-products__price" th:text="${product.price} + ' 원'">가격</p>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</section>

<section class="titles-section">
    <div class="title-wrapper">
        <div class="title-large">콩떡찰떡</div>
        <div class="title-small">비지샵 상품과 콩들의 찰떡궁합! 생생후기!</div>
    </div>
    <div class="more-link">
        <a href="/ootd/list">더보기 &nbsp; →</a>
    </div>
</section>

<section class="ootd-slider">
    <div class="ootd-slider-track-container">
        <div class="ootd-slider-track">
            <div class="ootd-slide" th:each="ootd : ${ootdList}" th:data-id="${ootd.id}">
                <img th:src="@{${ootd.imgUrls}}" th:alt="${ootd.tags}">
            </div>
        </div>
    </div>
</section>


<section class="titles-section">
    <div class="title-wrapper">
        <div class="title-large">콩나물</div>
        <div class="title-small">콩들에게 파는 나의 물건</div>
    </div>
    <div class="more-link">
        <a href="/product/list">더보기 &nbsp; →</a>
    </div>
</section>

<section class="related-products">
    <div class="related-products__carousel">
        <div class="related-products__track-container">
            <ul class="related-products__track">
                <li class="related-products__slide" th:each="product : ${products}">
                    <div class="related-products__card">
                        <div class="related-products__image">
                            <a th:href="@{/product/detail/{id}(id=${product.id})}">
                                <img th:src="@{${product.mainPicturePath}}" alt="상품 이미지">
                            </a>
                        </div>
                        <p class="related-products__name" th:text="${product.name}">상품명</p>
                        <p class="related-products__price" th:text="${product.price} + ' 원'">가격</p>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
