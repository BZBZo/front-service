<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/layout.js}"></script>
    <link th:href="@{/css/layout.css}" rel="stylesheet">
    <link th:href="@{/css/sale_history.css}" rel="stylesheet">
    <title>판매 내역</title>
</head>
<body>
<header>
    <div th:replace="~{fragments/header :: header}"></div>
</header>

<main>
    <div class="container">
        <div class="header-container">
            <h2>판매 내역</h2>
            <div class="total-sales">총 판매액: <span th:text="${#numbers.formatInteger(totalSalesAmount, 3, 'COMMA')}"></span> 원</div>
        </div>

        <div class="table-container">
            <table class="sale-history-table">
                <thead>
                <tr>
                    <th>상품 ID</th>
                    <th>상품 이름</th>
                    <th>상품 이미지</th>
                    <th>수량</th>
                    <th>총액</th>
                    <th>구매자 ID</th>
                    <th>주문 번호</th>
                    <th>승인 날짜</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="history : ${saleHistoryList}">
                    <td th:text="${history.productId}"></td>
                    <td th:text="${history.productName}"></td>
                    <td>
                        <img class="product-image" th:src="@{${history.imgUrl}}" th:alt="${history.productName}" />
                    </td>
                    <td th:text="${history.quantity}"></td>
                    <td th:text="${history.price}"></td>
                    <td th:text="${history.memberNo}"></td>
                    <td th:text="${history.orderId}"></td>
                    <td th:text="${history.approvedAt}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="no-history" th:if="${#lists.isEmpty(saleHistoryList)}">
            판매 내역이 없습니다.
        </div>
    </div>
</main>

<footer>
    <div th:replace="~{fragments/footer :: footer}"></div>
</footer>
</body>
</html>
