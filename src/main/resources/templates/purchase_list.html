<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/layout.js}"></script>
  <script th:src="@{/js/purchase_list.js}"></script>
  <link th:href="@{/css/layout.css}" rel="stylesheet">
  <link th:href="@{/css/purchase_list.css}" rel="stylesheet">
  <title>장바구니</title>
</head>
<body>
<header>
  <div th:replace="~{fragments/header :: header}"></div>
</header>
<main>
  <div class="order-status">
    <h2>주문현황</h2>
    <table>
      <thead>
      <tr>
        <th>번호</th>
        <th>주문일</th>
        <th>상품이미지</th>
        <th>상품명</th>
        <th>수량</th>
        <th>금액</th>
        <th>리뷰 작성</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="purchase, iterStat : ${purchases}">
        <td th:text="${iterStat.count}"></td> <!-- 번호 -->
        <td th:text="${purchase.approvedAt}"></td> <!-- 주문일 -->
        <td colspan="5">
          <table>
            <tr th:each="product : ${purchase.products}"> <!-- Products are now directly associated with each purchase -->
              <td><img class="product-image" th:src="@{${product.mainPicturePath}}" th:alt="${product.name}"/></td>
              <td class="product-name" th:text="${product.name}"></td>
              <td th:text="${product.quantity}"></td>
              <td th:text="${product.price}"></td>
              <td>
                <div th:if="${product.isReviewedForPurchase(purchase.purchaseId)}">
                  <a th:href="@{|/customer/history/review/detail/${product.id}/${purchase.purchaseId}|}" class="reviewed-button">작성 완료</a>
                </div>
                <div th:unless="${product.isReviewedForPurchase(purchase.purchaseId)}">
                  <a th:href="@{|/customer/history/review/${product.id}/${purchase.purchaseId}|}" class="review-button">리뷰 작성</a>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
<footer>
  <div th:replace="~{fragments/footer :: footer}"></div>
</footer>
</body>
</html>
