<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:src="@{/js/signin.js}" defer></script>
    <link th:href="@{/css/signin.css}" rel="stylesheet">
    <link th:href="@{/css/layout.css}" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- jQuery 라이브러리 -->

    <title>Title</title>
</head>
<body>
<div id="header" th:replace="~{fragments/header :: header}"></div>
<main>
    <div class="login-container">
        <h1>오늘도, BZ#</h1>
        <hr class="divider">
        <div class="login-buttons">
            <!-- 구글 로그인 -->
            <button class="login-button google-login" id="google-login" data-provider="google">
                <img src="/images/google-icon2.png" alt="구글 아이콘" class="icon">
                <span class="text">구글 로그인</span>
            </button>
            <!-- 네이버 로그인 -->
            <button class="login-button naver-login" id="naver-login" data-provider="naver">
                <img src="/images/naver-icon.png" alt="네이버 아이콘" class="icon">
                <span class="text">네이버 로그인</span>
            </button>
            <!-- 카카오 로그인 -->
            <button class="login-button kakao-login" id="kakao-login" data-provider="kakao">
                <img src="/images/kakao-icon.png" alt="카카오 아이콘" class="icon">
                <span class="text">카카오 로그인</span>
            </button>
            <!-- 자체 로그인 버튼 추가 -->
            <button class="login-button email-login" id="email-login">
                <img src="/images/email-icon.png" alt="이메일 아이콘" class="icon">
                <span class="text">BZ# 로그인</span>
            </button>
        </div>

        <!-- 이메일 로그인 폼 (초기에는 숨김) -->
        <div class="email-login-form hidden">
            <input type="email" id="email" name="email" placeholder="이메일 입력" class="input-field">
            <input type="password" id="password" name="password" placeholder="비밀번호 입력" class="input-field">
            <button type="button" id="signin-button" class="signin-button">로그인</button>
        </div>

        <!--            <button class="test-button">전체멤버</button>-->
        <!--            <button class="test2-button">feign~</button>-->

        <p class="signup-text">
            아직 회원이 아니신가요? <a href="/webs/join">회원가입</a>
        </p>
    </div>
</main>
<div id="footer" th:replace="~{fragments/footer :: footer}"></div>

<script>
    $(document).ready(function() {
        // 이메일 로그인 버튼 클릭 시 로그인 폼 표시
        $("#email-login").click(function() {
            $(".email-login-form").toggleClass("hidden");
        });

        // 로그인 버튼 클릭 이벤트
        $("#signin-button").click(function() {
            let email = $("#email").val();
            let password = $("#password").val();

            if (!email || !password) {
                alert("이메일과 비밀번호를 입력하세요.");
                return;
            }

            $.ajax({
                type: "POST",
                url: "/webs/signin",
                data: JSON.stringify({ email: email, password: password }),
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: function(response) {
                    alert("로그인 성공!");
                    window.location.href = response.url;
                },
                error: function(error) {
                    alert("로그인 실패: 이메일 또는 비밀번호를 확인하세요.");
                }
            });
        });
    });
</script>

</body>
</html>
