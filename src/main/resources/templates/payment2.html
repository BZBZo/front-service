<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <link
            rel="icon"
            href="https://static.toss.im/icons/png/4x/icon-toss-logo.png"
    />
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장바구니 결제</title>
    <!-- 결제위젯 SDK 추가 -->
    <script src="https://js.tosspayments.com/v1/payment-widget"></script>
</head>

<body>
<div style="display: none;">
    <span id="member-email" th:text="${member.email}"></span>
    <span id="member-no" th:text="${member.memberNo}"></span>
    <span id="member-nickname" th:text="${member.nickname}"></span>
    <span id="member-phone" th:text="${member.phone}"></span>
</div>

<script th:inline="javascript">
    const productList = /*[[${productList}]]*/ [];
    console.log("Loaded productList:", productList);
</script>

<!-- 주문서 영역 -->
<div class="wrapper">
    <h2>주문 확인</h2>
    <table>
        <thead>
        <tr>
            <th>상품 ID</th>
            <th>수량</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${productList}">
            <td th:text="${product.productId}"></td>
            <td th:text="${product.quantity}"></td>
        </tr>
        </tbody>
    </table>

    <div class="summary">
        <p>총 주문 금액: <span id="total-price" th:text="${totalPrice}"></span> 원</p>
    </div>

    <div
            class="box_section"
            style="
                padding: 40px 30px 50px 30px;
                margin-top: 30px;
                margin-bottom: 50px;
            "
    >
        <!-- 결제 UI -->
        <div id="payment-method"></div>
        <!-- 이용약관 UI -->
        <div id="agreement"></div>
        <!-- 쿠폰 체크박스 -->
        <div style="padding-left: 25px">
            <div class="checkable typography--p">
                <label for="coupon-box" class="checkable__label typography--regular"
                ><input
                        id="coupon-box"
                        class="checkable__input"
                        type="checkbox"
                        aria-checked="true"
                /><span class="checkable__label-text"
                >5,000원 쿠폰 적용</span
                ></label
                >
            </div>
        </div>
        <!-- 결제하기 버튼 -->
        <div class="result wrapper">
            <button class="button" id="payment-button" style="margin-top: 30px">
                결제하기
            </button>
        </div>
    </div>
</div>

<script>
    const totalPrice = parseFloat(document.getElementById("total-price").innerText.replace(" 원", ""));
    const coupon = document.getElementById("coupon-box");
    const button = document.getElementById("payment-button");

    const generateRandomString = () =>
        window.btoa(Math.random()).slice(0, 20);

    var amount = totalPrice;

    // ------ 결제위젯 초기화 ------
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    const customerKey = generateRandomString();
    const paymentWidget = PaymentWidget(clientKey, customerKey);

    // ------ 결제 UI 렌더링 ------
    const paymentMethodWidget = paymentWidget.renderPaymentMethods(
        "#payment-method",
        { value: amount },
        { variantKey: "DEFAULT" }
    );

    // ------ 이용약관 UI 렌더링 ------
    paymentWidget.renderAgreement("#agreement", { variantKey: "AGREEMENT" });

    // ------ 결제 금액 업데이트 ------
    coupon.addEventListener("change", function () {
        if (coupon.checked) {
            paymentMethodWidget.updateAmount(amount - 5000);
        } else {
            paymentMethodWidget.updateAmount(amount);
        }
    });

    // ------ '결제하기' 버튼 누르면 결제창 띄우기 ------
    button.addEventListener("click", function () {
        paymentWidget.requestPayment({
            orderId: generateRandomString(),
            orderName: `장바구니 결제: ${JSON.stringify(productList)}`,
            successUrl: window.location.origin + "/customer/purchase/success",
            failUrl: window.location.origin + "/customer/purchase/fail",
            metadata: {
                memberEmail: document.getElementById("member-email").innerText,
                memberName: document.getElementById("member-nickname").innerText,
                memberPhone: document.getElementById("member-phone").innerText,
                memberNo: document.getElementById("member-no").innerText,
                productList: JSON.stringify(productList),
            },
        });
    });
</script>
</body>
</html>
